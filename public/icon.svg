<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background with rounded corners for standalone view -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>

  <!-- Subtle glow ring inside safe zone -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#06b6d4" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Smart AC Unit stylized body -->
  <g transform="translate(96, 120)">
    <!-- AC Main Shell -->
    <rect x="0" y="0" width="320" height="130" rx="24" fill="#0f172a" stroke="url(#cyanGrad)" stroke-width="6" filter="url(#glow)"/>
    <rect x="4" y="4" width="312" height="122" rx="20" fill="#1e293b"/>

    <!-- AC Air Vanes / Grill Line -->
    <path d="M 28 92 L 292 92" stroke="#06b6d4" stroke-width="4" stroke-linecap="round"/>
    <path d="M 36 106 L 284 106" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.7"/>

    <!-- LED Display on AC with 24°C -->
    <rect x="210" y="24" width="84" height="42" rx="10" fill="#020617" stroke="#06b6d4" stroke-width="2"/>
    <text x="252" y="52" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle">24°C</text>

    <!-- Wi-Fi / Smart Signal Wave -->
    <circle cx="48" cy="45" r="5" fill="#10b981"/>
    <path d="M 40 35 A 12 12 0 0 1 56 35" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
    <path d="M 34 27 A 20 20 0 0 1 62 27" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Cooling Snowflake & Wind Stream below AC -->
  <g transform="translate(256, 350)" filter="url(#glow)">
    <!-- Central Snowflake Hexagon / Core -->
    <circle cx="0" cy="0" r="16" fill="url(#cyanGrad)"/>

    <!-- 6 Snowflake Rays -->
    <g stroke="url(#cyanGrad)" stroke-width="6" stroke-linecap="round">
      <!-- Top / Bottom -->
      <line x1="0" y1="-56" x2="0" y2="56"/>
      <path d="M -16 -38 L 0 -48 L 16 -38"/>
      <path d="M -16 38 L 0 48 L 16 38"/>

      <!-- Diagonal 1 (60 deg) -->
      <line x1="-48" y1="-28" x2="48" y2="28"/>
      <path d="M -42 -8 L -42 -24 L -26 -24"/>
      <path d="M 42 8 L 42 24 L 26 24"/>

      <!-- Diagonal 2 (120 deg) -->
      <line x1="-48" y1="28" x2="48" y2="-28"/>
      <path d="M -26 24 L -42 24 L -42 8"/>
      <path d="M 26 -24 L 42 -24 L 42 -8"/>
    </g>
  </g>

  <!-- Cool Wind Waves -->
  <path d="M 130 275 Q 160 290 190 275 T 250 275" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
  <path d="M 262 275 Q 292 290 322 275 T 382 275" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-opacity="0.8"/>
</svg>
