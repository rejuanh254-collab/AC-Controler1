    <script>
      // Suppress Vite HMR WebSocket connection errors in preview iframe environment
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e && (e.reason || e);
        var msg = reason && (reason.message || String(reason));
        var stack = reason && (reason.stack || '');
        if (
          (msg && (
            msg.includes('WebSocket') ||
            msg.includes('@vite/client') ||
            msg.includes('vite') ||
            msg.includes('closed without opened')
          )) ||
          stack.includes('@vite/client')
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);

      window.addEventListener('error', function (e) {
        var msg = e && (e.message || String(e));
        var fn = (e && e.filename) || '';
        if (
          fn.includes('@vite/client') ||
          (msg && (
            msg.includes('WebSocket') ||
            msg.includes('@vite/client') ||
            msg.includes('vite') ||
            msg.includes('closed without opened')
          ))
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);

      // Early listener for PWA 1-click installation before React components load
      window.__deferredPWAInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        // Save prompt event so in-app 1-click button can invoke prompt()
        window.__deferredPWAInstallPrompt = e;
        window.dispatchEvent(new CustomEvent('pwa-prompt-ready', { detail: e }));
      });
    </script>
